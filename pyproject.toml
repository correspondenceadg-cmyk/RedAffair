[project]
name = "redaffair"
version = "1.222.2"
description = "A text-based adventure and detective game written in Python"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "charset-normalizer",
    "kivy>=2.3.1,<3.0.0",
]

[project.scripts]
redaffair = "redaffair:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["redaffair*"]

[tool.setuptools.package-data]
redaffair = [
    "assets/*.png",
    "audio/*.ogg",
    "audio/sfx/*.ogg",
    "fonts/*.otf",
    "fonts/*.ttf",
]

[tool.uv.sources]
ksp-bootstraps = { git = "https://github.com/kivy-school/ksp-bootstraps", branch = "master" }

[dependency-groups]
dev = [
    "ksp-bootstraps",
    "ksproject",
]

[tool.uv]
index-strategy = "unsafe-best-match"
find-links = ["./wheelhouse"]

[tool.uv.pip]
extra-index-url = [
    "https://pypi-index.psychowaspx.workers.dev/simple",
    "https://pypi.anaconda.org/kivyschool/simple"
]
find-links = ["./wheelhouse"]

#### kivy-school configuration ####

[tool.kivy-school]
app_name = "Red Affair"
bootstrap = "kivy"

[tool.kivy-school.android]
