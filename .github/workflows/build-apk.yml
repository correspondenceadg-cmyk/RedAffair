name: Build APK with ksproject
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - name: Setup uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.12.1"
    - name: Build debug APK
      run: uv run ksproject android build debug --clean
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: red-affair-apk
        path: project_dist/gradle/app/build/outputs/apk/debug/app-debug.apk
